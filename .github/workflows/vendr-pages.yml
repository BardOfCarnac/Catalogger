name: Deploy Vend-R Pages

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "data/curation/item-images.json"
      - "data/curation/item-image-pool.json"
      - ".github/workflows/vendr-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: vendr-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare Vend-R site
        run: |
          mkdir -p _site/data/curation
          cp index.html _site/index.html
          cp data/curation/item-images.json _site/data/curation/item-images.json
          cp data/curation/item-image-pool.json _site/data/curation/item-image-pool.json

      - name: Upload Vend-R site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
