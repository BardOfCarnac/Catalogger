name: Validate catalogue

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_catalog.py
      - run: python scripts/build_commercial_profiles.py
      - run: python scripts/review_product_identity.py
      - run: python scripts/validate_stocking.py
      - run: python scripts/test_stock_engine.py
      - run: python scripts/test_stock_lifecycle.py
      - run: python scripts/test_night_city_stock.py
      - run: python scripts/test_vendr_stock_engine_contract.py
      - run: python scripts/test_vendr_demo_backend.py
      - run: python -m py_compile scripts/night_city_stock.py scripts/vendr_demo_backend.py scripts/vendr_demo_server.py
      - run: node --check web/vendr-live/app.js
