name: Validate catalogue

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_catalog.py
      - run: python scripts/build_commercial_profiles.py
      - run: python scripts/review_product_identity.py
      - run: python scripts/validate_stocking.py
      - run: python scripts/test_stock_engine.py
      - run: python scripts/test_stock_lifecycle.py
      - run: python scripts/test_kaito_market.py
      - run: python scripts/build_kaito_market.py
      - run: python scripts/test_world_fixture.py
      - run: python scripts/test_world_fixture_pacifica_rancho.py
      - run: python scripts/test_world_fixture_little_china_reclamation.py
      - run: python scripts/test_world_fixture_santo_watson.py
      - run: python scripts/test_world_fixture_ocz_university.py
      - run: python scripts/test_world_fixture_south_glen.py
      - run: python scripts/test_world_fixture_westbrook_japantown.py
      - run: python scripts/import_nc2045_audit_batch.py --input data/worlds/night-city-2045/import/downtown-core.audit-v0.2.json --output build/data/worlds/night-city-2045/import/downtown-core.audit-draft.json
      - run: python scripts/import_nc2045_audit_batch.py --input data/worlds/night-city-2045/import/little-europe-remainder.audit-v0.2.json --output build/data/worlds/night-city-2045/import/little-europe-remainder.audit-draft.json
      - run: python scripts/import_nc2045_audit_batch.py --input data/worlds/night-city-2045/import/upper-marina-core.audit-v0.2.json --output build/data/worlds/night-city-2045/import/upper-marina-core.audit-draft.json
      - run: python scripts/import_nc2045_audit_batch.py --input data/worlds/night-city-2045/import/kabuki-core.audit-v0.2.json --output build/data/worlds/night-city-2045/import/kabuki-core.audit-draft.json
      - run: python scripts/import_nc2045_audit_batch.py --input data/worlds/night-city-2045/import/north-heywood-core.audit-v0.2.json --output build/data/worlds/night-city-2045/import/north-heywood-core.audit-draft.json
      - run: python scripts/import_nc2045_audit_batch.py --input data/worlds/night-city-2045/import/pacifica-playground-core.audit-v0.2.json --output build/data/worlds/night-city-2045/import/pacifica-playground-core.audit-draft.json
      - run: python scripts/import_nc2045_audit_batch.py --input data/worlds/night-city-2045/import/rancho-coronado-core.audit-v0.2.json --output build/data/worlds/night-city-2045/import/rancho-coronado-core.audit-draft.json
      - run: python scripts/import_nc2045_audit_batch.py --input data/worlds/night-city-2045/import/little-china-core.audit-v0.2.json --output build/data/worlds/night-city-2045/import/little-china-core.audit-draft.json
      - run: python scripts/import_nc2045_audit_batch.py --input data/worlds/night-city-2045/import/reclamation-zone-core.audit-v0.2.json --output build/data/worlds/night-city-2045/import/reclamation-zone-core.audit-draft.json
      - run: python scripts/import_nc2045_audit_batch.py --input data/worlds/night-city-2045/import/santo-domingo-core.audit-v0.2.json --output build/data/worlds/night-city-2045/import/santo-domingo-core.audit-draft.json
      - run: python scripts/import_nc2045_audit_batch.py --input data/worlds/night-city-2045/import/watson-development-core.audit-v0.2.json --output build/data/worlds/night-city-2045/import/watson-development-core.audit-draft.json
      - run: python scripts/import_nc2045_audit_batch.py --input data/worlds/night-city-2045/import/old-combat-zone-core.audit-v0.2.json --output build/data/worlds/night-city-2045/import/old-combat-zone-core.audit-draft.json
      - run: python scripts/import_nc2045_audit_batch.py --input data/worlds/night-city-2045/import/university-district-core.audit-v0.2.json --output build/data/worlds/night-city-2045/import/university-district-core.audit-draft.json
      - run: python scripts/import_nc2045_audit_batch.py --input data/worlds/night-city-2045/import/south-night-city-core.audit-v0.2.json --output build/data/worlds/night-city-2045/import/south-night-city-core.audit-draft.json
      - run: python scripts/import_nc2045_audit_batch.py --input data/worlds/night-city-2045/import/the-glen-core.audit-v0.2.json --output build/data/worlds/night-city-2045/import/the-glen-core.audit-draft.json
      - run: python scripts/import_nc2045_audit_batch.py --input data/worlds/night-city-2045/import/new-westbrook-core.audit-v0.2.json --output build/data/worlds/night-city-2045/import/new-westbrook-core.audit-draft.json
      - run: python scripts/import_nc2045_audit_batch.py --input data/worlds/night-city-2045/import/old-japantown-core.audit-v0.2.json --output build/data/worlds/night-city-2045/import/old-japantown-core.audit-draft.json
      - run: python scripts/build_world_fixture.py --input data/worlds/night-city-2045/kaito-market.v1.json --output build/data/worlds/night-city-2045/kaito-market.generic.json
      - run: python scripts/build_world_fixture.py --input data/worlds/night-city-2045/downtown-core.v1.json --output build/data/worlds/night-city-2045/downtown-core.v1.json
      - run: python scripts/build_world_fixture.py --input data/worlds/night-city-2045/little-europe-remainder.v1.json --output build/data/worlds/night-city-2045/little-europe-remainder.v1.json
      - run: python scripts/build_world_fixture.py --input data/worlds/night-city-2045/upper-marina-core.v1.json --output build/data/worlds/night-city-2045/upper-marina-core.v1.json
      - run: python scripts/build_world_fixture.py --input data/worlds/night-city-2045/kabuki-core.v1.json --output build/data/worlds/night-city-2045/kabuki-core.v1.json
      - run: python scripts/build_world_fixture.py --input data/worlds/night-city-2045/north-heywood-core.v1.json --output build/data/worlds/night-city-2045/north-heywood-core.v1.json
      - run: python scripts/build_world_fixture.py --input data/worlds/night-city-2045/pacifica-playground-core.v1.json --output build/data/worlds/night-city-2045/pacifica-playground-core.v1.json
      - run: python scripts/build_world_fixture.py --input data/worlds/night-city-2045/rancho-coronado-core.v1.json --output build/data/worlds/night-city-2045/rancho-coronado-core.v1.json
      - run: python scripts/build_world_fixture.py --input data/worlds/night-city-2045/little-china-core.v1.json --output build/data/worlds/night-city-2045/little-china-core.v1.json
      - run: python scripts/build_world_fixture.py --input data/worlds/night-city-2045/reclamation-zone-core.v1.json --output build/data/worlds/night-city-2045/reclamation-zone-core.v1.json
      - run: python scripts/build_world_fixture.py --input data/worlds/night-city-2045/santo-domingo-core.v1.json --output build/data/worlds/night-city-2045/santo-domingo-core.v1.json
      - run: python scripts/build_world_fixture.py --input data/worlds/night-city-2045/watson-development-core.v1.json --output build/data/worlds/night-city-2045/watson-development-core.v1.json
      - run: python scripts/build_world_fixture.py --input data/worlds/night-city-2045/old-combat-zone-core.v1.json --output build/data/worlds/night-city-2045/old-combat-zone-core.v1.json
      - run: python scripts/build_world_fixture.py --input data/worlds/night-city-2045/university-district-core.v1.json --output build/data/worlds/night-city-2045/university-district-core.v1.json
      - run: python scripts/build_world_fixture.py --input data/worlds/night-city-2045/south-night-city-core.v1.json --output build/data/worlds/night-city-2045/south-night-city-core.v1.json
      - run: python scripts/build_world_fixture.py --input data/worlds/night-city-2045/the-glen-core.v1.json --output build/data/worlds/night-city-2045/the-glen-core.v1.json
      - run: python scripts/build_world_fixture.py --input data/worlds/night-city-2045/new-westbrook-core.v1.json --output build/data/worlds/night-city-2045/new-westbrook-core.v1.json
      - run: python scripts/build_world_fixture.py --input data/worlds/night-city-2045/old-japantown-core.v1.json --output build/data/worlds/night-city-2045/old-japantown-core.v1.json
