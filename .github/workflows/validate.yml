name: Validate catalogue

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_catalog.py
      - run: python scripts/build_commercial_profiles.py
      - run: python scripts/review_product_identity.py
      - run: python scripts/validate_stocking.py
      - run: python scripts/test_stock_engine.py
      - run: python scripts/test_stock_lifecycle.py
      - run: python scripts/test_kaito_market.py
      - run: python scripts/build_kaito_market.py
      - run: python scripts/test_world_fixture.py
      - run: python scripts/import_nc2045_audit_batch.py --input data/worlds/night-city-2045/import/downtown-core.audit-v0.2.json --output build/data/worlds/night-city-2045/import/downtown-core.audit-draft.json
      - run: python scripts/import_nc2045_audit_batch.py --input data/worlds/night-city-2045/import/little-europe-remainder.audit-v0.2.json --output build/data/worlds/night-city-2045/import/little-europe-remainder.audit-draft.json
      - run: python scripts/import_nc2045_audit_batch.py --input data/worlds/night-city-2045/import/upper-marina-core.audit-v0.2.json --output build/data/worlds/night-city-2045/import/upper-marina-core.audit-draft.json
      - run: python scripts/import_nc2045_audit_batch.py --input data/worlds/night-city-2045/import/kabuki-core.audit-v0.2.json --output build/data/worlds/night-city-2045/import/kabuki-core.audit-draft.json
      - run: python scripts/import_nc2045_audit_batch.py --input data/worlds/night-city-2045/import/north-heywood-core.audit-v0.2.json --output build/data/worlds/night-city-2045/import/north-heywood-core.audit-draft.json
      - run: python scripts/build_world_fixture.py --input data/worlds/night-city-2045/kaito-market.v1.json --output build/data/worlds/night-city-2045/kaito-market.generic.json
      - run: python scripts/build_world_fixture.py --input data/worlds/night-city-2045/downtown-core.v1.json --output build/data/worlds/night-city-2045/downtown-core.v1.json
      - run: python scripts/build_world_fixture.py --input data/worlds/night-city-2045/little-europe-remainder.v1.json --output build/data/worlds/night-city-2045/little-europe-remainder.v1.json
      - run: python scripts/build_world_fixture.py --input data/worlds/night-city-2045/upper-marina-core.v1.json --output build/data/worlds/night-city-2045/upper-marina-core.v1.json
      - run: python scripts/build_world_fixture.py --input data/worlds/night-city-2045/kabuki-core.v1.json --output build/data/worlds/night-city-2045/kabuki-core.v1.json
      - run: python scripts/build_world_fixture.py --input data/worlds/night-city-2045/north-heywood-core.v1.json --output build/data/worlds/night-city-2045/north-heywood-core.v1.json
