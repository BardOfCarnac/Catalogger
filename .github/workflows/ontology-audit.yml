name: Audit world ontology

on:
  push:
  pull_request:

jobs:
  ontology-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_commercial_profiles.py
      - run: python scripts/audit_world_ontology.py
      - run: python scripts/test_world_runtime.py
      - run: python scripts/test_world_map_geometry.py
      - run: python scripts/test_world_runtime_chain_profiles.py
      - run: python scripts/test_world_runtime_purchase_profiles.py
      - run: python scripts/test_world_runtime_market_profiles.py
      - run: python scripts/audit_world_runtime.py
      - run: python scripts/build_world_runtime.py --input data/worlds/night-city-2045/old-japantown-core.v1.json --output build/data/worlds/night-city-2045/old-japantown-core.runtime-v0.3.json
      - run: python scripts/test_world_fixture_retail_capable_port_south.py
      - run: python scripts/test_world_fixture_retail_capable_watson_downtown.py
      - run: python scripts/test_world_fixture_retail_capable_remaining.py
      - run: python scripts/test_world_fixture_review_queue_watson_playland.py
      - run: python scripts/test_world_fixture_review_queue_upper_downtown.py
      - run: python scripts/test_world_fixture_review_queue_kabuki_glen.py
      - run: python scripts/build_world_fixture.py --input data/worlds/night-city-2045/port-of-night-city-retail-capable.v1.json --output build/data/worlds/night-city-2045/port-of-night-city-retail-capable.v1.json
      - run: python scripts/build_world_fixture.py --input data/worlds/night-city-2045/south-night-city-retail-capable.v1.json --output build/data/worlds/night-city-2045/south-night-city-retail-capable.v1.json
      - run: python scripts/build_world_fixture.py --input data/worlds/night-city-2045/watson-development-retail-capable.v1.json --output build/data/worlds/night-city-2045/watson-development-retail-capable.v1.json
      - run: python scripts/build_world_fixture.py --input data/worlds/night-city-2045/downtown-retail-capable.v1.json --output build/data/worlds/night-city-2045/downtown-retail-capable.v1.json
      - run: python scripts/build_world_fixture.py --input data/worlds/night-city-2045/kabuki-retail-capable.v1.json --output build/data/worlds/night-city-2045/kabuki-retail-capable.v1.json
      - run: python scripts/build_world_fixture.py --input data/worlds/night-city-2045/old-combat-zone-retail-capable.v1.json --output build/data/worlds/night-city-2045/old-combat-zone-retail-capable.v1.json
      - run: python scripts/build_world_fixture.py --input data/worlds/night-city-2045/old-japantown-retail-capable.v1.json --output build/data/worlds/night-city-2045/old-japantown-retail-capable.v1.json
      - run: python scripts/build_world_fixture.py --input data/worlds/night-city-2045/pacifica-playground-retail-capable.v1.json --output build/data/worlds/night-city-2045/pacifica-playground-retail-capable.v1.json
      - run: python scripts/build_world_fixture.py --input data/worlds/night-city-2045/the-glen-retail-capable.v1.json --output build/data/worlds/night-city-2045/the-glen-retail-capable.v1.json
      - run: python scripts/build_world_fixture.py --input data/worlds/night-city-2045/charter-hill-retail-capable.v1.json --output build/data/worlds/night-city-2045/charter-hill-retail-capable.v1.json
      - run: python scripts/build_world_fixture.py --input data/worlds/night-city-2045/little-europe-retail-capable.v1.json --output build/data/worlds/night-city-2045/little-europe-retail-capable.v1.json
      - run: python scripts/build_world_fixture.py --input data/worlds/night-city-2045/upper-marina-retail-capable.v1.json --output build/data/worlds/night-city-2045/upper-marina-retail-capable.v1.json
      - run: python scripts/build_world_fixture.py --input data/worlds/night-city-2045/heywood-docks-retail-capable.v1.json --output build/data/worlds/night-city-2045/heywood-docks-retail-capable.v1.json
      - run: python scripts/build_world_fixture.py --input data/worlds/night-city-2045/heywood-industrial-zone-retail-capable.v1.json --output build/data/worlds/night-city-2045/heywood-industrial-zone-retail-capable.v1.json
      - run: python scripts/build_world_fixture.py --input data/worlds/night-city-2045/little-china-retail-capable.v1.json --output build/data/worlds/night-city-2045/little-china-retail-capable.v1.json
      - run: python scripts/build_world_fixture.py --input data/worlds/night-city-2045/new-westbrook-retail-capable.v1.json --output build/data/worlds/night-city-2045/new-westbrook-retail-capable.v1.json
      - run: python scripts/build_world_fixture.py --input data/worlds/night-city-2045/playland-by-the-sea-lands-retail-capable.v1.json --output build/data/worlds/night-city-2045/playland-by-the-sea-lands-retail-capable.v1.json
      - run: python scripts/build_world_fixture.py --input data/worlds/night-city-2045/rancho-coronado-retail-capable.v1.json --output build/data/worlds/night-city-2045/rancho-coronado-retail-capable.v1.json
      - run: python scripts/build_world_fixture.py --input data/worlds/night-city-2045/watson-development-review-queue.v1.json --output build/data/worlds/night-city-2045/watson-development-review-queue.v1.json
      - run: python scripts/build_world_fixture.py --input data/worlds/night-city-2045/playland-by-the-sea-lands-review-queue.v1.json --output build/data/worlds/night-city-2045/playland-by-the-sea-lands-review-queue.v1.json
      - run: python scripts/build_world_fixture.py --input data/worlds/night-city-2045/upper-marina-review-queue.v1.json --output build/data/worlds/night-city-2045/upper-marina-review-queue.v1.json
      - run: python scripts/build_world_fixture.py --input data/worlds/night-city-2045/downtown-review-queue.v1.json --output build/data/worlds/night-city-2045/downtown-review-queue.v1.json
      - run: python scripts/build_world_fixture.py --input data/worlds/night-city-2045/kabuki-review-queue.v1.json --output build/data/worlds/night-city-2045/kabuki-review-queue.v1.json
      - run: python scripts/build_world_fixture.py --input data/worlds/night-city-2045/the-glen-review-queue.v1.json --output build/data/worlds/night-city-2045/the-glen-review-queue.v1.json
      - run: python scripts/audit_retail_capable_candidates.py
      - run: python scripts/audit_review_queue_candidates.py
